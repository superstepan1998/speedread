<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeedRead · iPhone</title>
<style>
  :root { --bezel: #1a1a1c; --frame: #3a3a3e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, #2a2a33, #111116 70%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #stage { transform-origin: center center; }
  .phone {
    position: relative;
    width: 417px; height: 876px;
    border-radius: 68px;
    background: var(--bezel);
    padding: 12px;
    box-shadow: 0 0 0 2px var(--frame), 0 0 0 4px #1c1c1f, 0 40px 80px rgba(0,0,0,0.6);
  }
  .btn { position: absolute; background: var(--frame); border-radius: 2px; width: 4px; }
  .btn.action { left: -6px; top: 120px; height: 32px; }
  .btn.vol-up { left: -6px; top: 180px; height: 62px; }
  .btn.vol-dn { left: -6px; top: 256px; height: 62px; }
  .btn.power  { right: -6px; top: 210px; height: 96px; }
  .screen {
    position: relative;
    width: 393px; height: 852px;
    border-radius: 56px;
    overflow: hidden;
    background: #000;
    transition: background 0.3s;
  }
  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 54px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 34px 0 46px;
    color: #fff; font-size: 16px; font-weight: 600;
    z-index: 2; pointer-events: none;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 3;
  }
  .icons { display: flex; gap: 6px; align-items: center; color: inherit; }
  .icons svg { fill: currentColor; }
  .icons .batt-outline { stroke: currentColor; }
  iframe {
    position: absolute; top: 54px; left: 0;
    width: 393px; height: calc(852px - 54px - 34px);
    border: 0; background: transparent;
  }
  .home-area {
    position: absolute; bottom: 0; left: 0; right: 0; height: 34px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .home { width: 134px; height: 5px; border-radius: 3px; background: currentColor; opacity: 0.8; }
</style>
</head>
<body>
<div id="stage">
  <div class="phone">
    <div class="btn action"></div><div class="btn vol-up"></div><div class="btn vol-dn"></div><div class="btn power"></div>
    <div class="screen" id="screen">
      <div class="island"></div>
      <div class="status" id="status">
        <span id="clock">9:41</span>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .7 10.4 10.4 0 0 0 .8 3.6L2 4.9a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4.3a6.7 6.7 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.6l1.9-2a2.8 2.8 0 0 0-3.8 0z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect class="batt-outline" x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><rect x="24.5" y="4.5" width="1.6" height="4" rx=".8" opacity=".4"/></svg>
        </span>
      </div>
      <iframe id="app" src="./" title="SpeedRead"></iframe>
      <div class="home-area" id="home-area"><div class="home"></div></div>
    </div>
  </div>
</div>
<script>
  const stage = document.getElementById('stage');
  function fit() {
    const s = Math.min(1, (innerWidth - 32) / 430, (innerHeight - 32) / 890);
    stage.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  const clock = document.getElementById('clock');
  const tick = () => { const d = new Date(); clock.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
  tick(); setInterval(tick, 30000);

  // Same-origin: paint the fake status bar and home area to match the app's background.
  const app = document.getElementById('app');
  const screen = document.getElementById('screen');
  const fg = [document.getElementById('status'), document.getElementById('home-area')];
  setInterval(() => {
    const body = app.contentDocument && app.contentDocument.body;
    if (!body) return;
    const bg = getComputedStyle(body).backgroundColor;
    screen.style.background = bg;
    const [r, g, b] = (bg.match(/\d+/g) || [0, 0, 0]).map(Number);
    const color = (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#000' : '#fff';
    fg.forEach(n => { n.style.color = color; });
  }, 250);
</script>
</body>
</html>
